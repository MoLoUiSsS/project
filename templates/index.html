<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkNet | Smart Parking Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.1">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation & Tools -->
        <aside class="sidebar glass-panel">
            <div class="logo">
                <i class="fa-solid fa-car-on"></i>
                <h2>Park<span>Net</span></h2>
            </div>

            <nav class="nav-menu">
                <a href="/" class="nav-item active"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
                <a href="/parking" class="nav-item"><i class="fa-solid fa-road-barrier"></i> Parking Gate</a>
                <a href="/register" class="nav-item"><i class="fa-solid fa-user-plus"></i> Inscription</a>
                <a href="/admin" class="nav-item"><i class="fa-solid fa-shield-halved"></i> Admin</a>
            </nav>

            <!-- Camera Mobile Input Section -->
            <div class="mobile-capture-widget glass-panel">
                <h3><i class="fa-solid fa-mobile-screen"></i> Mode Capture</h3>
                <p>Scanner une plaque via appareil photo</p>
                <form id="capture-form" enctype="multipart/form-data">
                    <label for="camera-input" class="btn-primary ripple">
                        <i class="fa-solid fa-camera"></i> Prendre Photo
                    </label>
                    <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
                </form>
                <div id="upload-status"></div>
            </div>
        </aside>

        <!-- Main Dashboard Content -->
        <main class="main-content">
            <!-- Top App Bar -->
            <header class="topbar glass-panel">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-plate" placeholder="Rechercher une plaque...">
                </div>

                <div class="group-controls" style="display: flex; gap: 10px; margin-left: 15px;">
                    <select id="group-by-select" class="glass-panel"
                        style="padding: 10px; background: rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.1); color: white; border-radius: 8px; outline: none;">
                        <option value="none">Groupement : Aucun (Récent)</option>
                        <option value="wilaya">Grouper par Wilaya</option>
                        <option value="year">Grouper par Année</option>
                        <option value="type">Grouper par Type Véhicule</option>
                    </select>
                </div>

                <div class="user-profile" style="margin-left: auto;">
                    <div class="avatar">
                        <img src="https://ui-avatars.com/api/?name=Opérateur&background=0D8ABC&color=fff" alt="User"
                            style="width: 40px; height: 40px; border-radius: 50%;">
                    </div>
                </div>
            </header>

            <div class="dashboard-content">
                <!-- Statistics -->
                <div class="stats-row">
                    <div class="stat-card glass-panel">
                        <div class="stat-icon blue"><i class="fa-solid fa-car"></i></div>
                        <div class="stat-info">
                            <h4>Captures (Total)</h4>
                            <span class="stat-value" id="total-captures">---</span>
                        </div>
                    </div>
                    <div class="stat-card glass-panel">
                        <div class="stat-icon green"><i class="fa-solid fa-check-double"></i></div>
                        <div class="stat-info">
                            <h4>Précision Moyenne</h4>
                            <span class="stat-value">92.4%</span>
                        </div>
                    </div>
                    <div class="stat-card glass-panel">
                        <div class="stat-icon purple"><i class="fa-solid fa-video"></i></div>
                        <div class="stat-info">
                            <h4>Caméras Actives</h4>
                            <span class="stat-value">1 Flux Mobile</span>
                        </div>
                    </div>
                </div>

                <div class="main-dashboard-grid">
                    <!-- Real-time feed SocketIO list -->
                    <div class="feed-section glass-panel">
                        <div class="section-header">
                            <h3><i class="fa-solid fa-bolt"></i> Flux Temps Réel</h3>
                            <span class="live-indicator"><span class="pulse"></span> LIVE</span>
                        </div>
                        <div class="captures-list" id="realtime-feed">
                            <div class="loading-state">Chargement de l'historique...</div>
                        </div>
                    </div>

                    <!-- Selected Detail View -->
                    <div class="detail-section glass-panel" id="plate-detail">
                        <div class="empty-state">
                            <i class="fa-solid fa-id-card"></i>
                            <p>Sélectionnez une capture pour voir les détails</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.1/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}?v=1.2"></script>
</body>

</html>
